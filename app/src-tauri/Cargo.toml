[package]
name = "orfoni"
version = "0.1.0"
description = "Desktop app that follows and answers Claude Code sessions on a remote machine over SSH"
authors = ["Manuel Schurr <schurrmanuel@gmail.com>"]
license = "MIT"
repository = "https://github.com/manuelschurr/orfoni"
edition = "2024"
rust-version = "1.90"

[lib]
name = "orfoni_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
russh = { version = "0.65.0", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
